<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة ملف شخصي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      place-items: center;
      background: linear-gradient(135deg, #e8efff, #f7eaff);
      color: #263248;
      font-family: Arial, Tahoma, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 370px;
      padding: 32px 26px;
      border: 1px solid #ffffff;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 18px 45px #28345a20;
      text-align: center;
    }

    .avatar {
      display: grid;
      width: 100px;
      height: 100px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 50%;
      background: #5268dc;
      color: white;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .job {
      margin: 0 0 18px;
      color: #5268dc;
      font-weight: bold;
    }

    .bio {
      margin: 0 0 23px;
      color: #737b8c;
      line-height: 1.8;
    }

    .links {
      display: grid;
      gap: 10px;
    }

    .links a {
      display: block;
      padding: 12px;
      border: 1px solid #e5e9f1;
      border-radius: 10px;
      color: #334bc4;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .links a:hover,
    .links a:focus {
      background: #5268dc;
      color: white;
      outline: none;
    }

    .footer {
      margin: 22px 0 0;
      color: #9aa1ae;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar" aria-label="الصورة الرمزية">م</div>

    <h1>محمد أحمد</h1>
    <p class="job">مصمم ومطور ويب</p>

    <p class="bio">
      أحب تصميم صفحات ويب بسيطة وجميلة، وأتعلم باستمرار تقنيات جديدة.
    </p>

    <nav class="links" aria-label="روابط التواصل">
      <a href="mailto:example@email.com">البريد الإلكتروني</a>
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </nav>

    <p class="footer">© 2026 محمد أحمد</p>
  </main>
</body>
</html>
