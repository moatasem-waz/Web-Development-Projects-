<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      place-items: center;
      background: linear-gradient(135deg, #edf1ff, #f8edff);
      color: #27324a;
      font-family: Arial, Tahoma, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 34px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 16px 45px #26345a1c;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #788397;
      text-align: center;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce2ec;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #5268dc;
      box-shadow: 0 0 0 3px #5268dc20;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 5px 0 20px;
      color: #687287;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .remember input {
      width: auto;
      accent-color: #5268dc;
    }

    a {
      color: #5268dc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .submit-button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #5268dc;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #4055c5;
    }

    .signup {
      margin: 22px 0 0;
      color: #687287;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 450px) {
      .login-card {
        padding: 27px 21px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>مرحبًا بعودتك</h1>
    <p class="subtitle">أدخل بياناتك للمتابعة</p>

    <form action="#" method="post">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="name@example.com"
          autocomplete="email"
          required>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="أدخل كلمة المرور"
          autocomplete="current-password"
          required>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" name="remember">
          تذكرني
        </label>

        <a href="mailto:help@example.com?subject=استعادة%20كلمة%20المرور">
          نسيت كلمة المرور؟
        </a>
      </div>

      <button class="submit-button" type="submit">تسجيل الدخول</button>
    </form>

    <p class="signup">
      ليس لديك حساب؟
      <a href="mailto:help@example.com?subject=إنشاء%20حساب">تواصل معنا</a>
    </p>
  </main>
</body>
</html>
